title:
  en_us: Sync Views
author: Yahya Morcy
engine:
  persistent: true
tooltip:
  en_us: >-
    Plans open on the same spot: when you switch from one plan view to another, the new plan keeps the
    same zoom and position.

    How: click to turn it ON (red icon) / OFF (grey icon). Works between floor, ceiling, structural and
    area plans only - never for 3D views, sections or elevations. Remembered and applied every time
    Revit opens.
help_url: https://ynan3000.github.io/emperor-revit/#toggles
